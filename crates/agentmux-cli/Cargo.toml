[package]
name = "agentmux-cli"
version = "1.0.4"
edition = "2024"

[dependencies]
agentmux-core = { version = "0.1.0", path = "../agentmux-core" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[bin]]
name = "agentmux"
path = "src/main.rs"
