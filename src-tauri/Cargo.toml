[package]
name = "agentmux-app"
version = "0.1.1"
edition = "2024"
description = "AgentMux desktop app"

[lib]
name = "agentmux_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agentmux-core = { version = "0.1.0", path = "../crates/agentmux-core" }
anyhow = "1.0.104"
chrono = "0.4.45"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
