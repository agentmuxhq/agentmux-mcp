name: Publish to npm

# Publishes @agentmuxhq/cli and its per-Mac binary packages from a GitHub release's CLI tarballs.
# Started by the release workflow; can also be run by hand for an existing release:
#   gh workflow run npm-publish.yml -f version=0.2.4
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 0.2.4 (its GitHub release must exist)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      # An npm token (repo or org secret NPM_TOKEN) is used if present; otherwise Trusted Publishing.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing (OIDC): npm checks that this run comes from agentmuxhq/agentmux-mcp's
      # npm-publish.yml, so no token is needed. Needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - name: Publish
        run: |
          V="${VERSION#v}"
          mkdir -p dl/arm64 dl/x64
          gh release download "v$V" --repo "$GITHUB_REPOSITORY" -p "agentmux-cli-$V-darwin-*.tar.gz" -D dl
          tar -xzf "dl/agentmux-cli-$V-darwin-arm64.tar.gz" -C dl/arm64
          tar -xzf "dl/agentmux-cli-$V-darwin-x64.tar.gz" -C dl/x64
          bash scripts/npm-packages.sh "$V" dl/arm64/agentmux dl/x64/agentmux out
          # Binary packages first, then the launcher that depends on them. Already published = skip,
          # so a re-run only does what's missing. Paths start with ./ or npm reads them as GitHub repos.
          for P in cli-darwin-arm64 cli-darwin-x64 cli; do
            if npm view "@agentmuxhq/$P@$V" version >/dev/null 2>&1; then
              echo "@agentmuxhq/$P@$V is already published"
            else
              npm publish "./out/$P" --access public
            fi
          done
